<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    h1 {
      color: white;
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -1px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .game-wrapper {
      display: flex;
      gap: 32px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
    }

    canvas {
      background: #1a1a2e;
      border: 3px solid white;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .stats {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      padding: 32px;
      min-width: 200px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-label {
      font-size: 0.875rem;
      color: #666;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 700;
      color: #667eea;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid #e0e0e0;
    }

    .control-text {
      font-size: 0.875rem;
      color: #666;
      line-height: 1.5;
    }

    .button-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      background: #667eea;
      color: white;
      flex: 1;
      min-width: 100px;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #667eea;
      flex: 1;
      min-width: 100px;
    }

    .btn-secondary:hover {
      background: #e8e8e8;
      transform: translateY(-2px);
    }

    .game-over {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .game-over.show {
      display: flex;
    }

    .game-over-content {
      background: white;
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .game-over h2 {
      font-size: 2rem;
      color: #667eea;
      margin-bottom: 12px;
    }

    .game-over p {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 24px;
      font-weight: 600;
    }

    .game-over button {
      background: #667eea;
      color: white;
      padding: 14px 32px;
      font-size: 1rem;
    }

    .game-over button:hover {
      background: #5568d3;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2rem;
      }

      .game-wrapper {
        gap: 20px;
      }

      canvas {
        max-width: 100%;
      }

      .stats {
        min-width: 160px;
        padding: 24px;
      }

      .stat-value {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐍 Snake</h1>

    <div class="game-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">Score</div>
          <div class="stat-value" id="scoreDisplay">0</div>
        </div>

        <div class="stat">
          <div class="stat-label">High Score</div>
          <div class="stat-value" id="highScoreDisplay">0</div>
        </div>

        <div class="controls">
          <div class="control-text">
            <strong>Controls:</strong><br>
            Arrow keys or WASD to move
          </div>

          <div class="button-group">
            <button class="btn-primary" id="startBtn">Start Game</button>
            <button class="btn-secondary" id="pauseBtn">Pause</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="game-over" id="gameOverModal">
    <div class="game-over-content">
      <h2>Game Over!</h2>
      <p id="finalScore">Score: 0</p>
      <button onclick="document.getElementById('startBtn').click()">Play Again</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    // Game state
    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let direction = {x: 1, y: 0};
    let nextDirection = {x: 1, y: 0};
    let score = 0;
    let highScore = localStorage.getItem('snakeHighScore') || 0;
    let gameRunning = false;
    let gamePaused = false;
    let gameLoopId = null;

    // UI elements
    const scoreDisplay = document.getElementById('scoreDisplay');
    const highScoreDisplay = document.getElementById('highScoreDisplay');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const gameOverModal = document.getElementById('gameOverModal');

    highScoreDisplay.textContent = highScore;

    function spawnFood() {
      let newFood;
      let valid = false;
      while (!valid) {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
        valid = !snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
      }
      food = newFood;
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid (optional, subtle)
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      // Draw snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          // Head
          ctx.fillStyle = '#f43f5e';
          ctx.shadowColor = 'rgba(244, 63, 94, 0.5)';
          ctx.shadowBlur = 10;
        } else {
          // Body
          ctx.fillStyle = '#f472b6';
          ctx.shadowColor = 'transparent';
        }
        ctx.fillRect(
          segment.x * gridSize + 1,
          segment.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
        ctx.shadowColor = 'transparent';
      });

      // Draw food
      ctx.fillStyle = '#fbbf24';
      ctx.shadowColor = 'rgba(251, 191, 36, 0.5)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowColor = 'transparent';
    }

    function update() {
      direction = nextDirection;

      const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

      // Check wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        endGame();
        return;
      }

      // Check self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Check food collision
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreDisplay.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function gameLoop() {
      if (!gamePaused) {
        update();
        draw();
      }
    }

    function startGame() {
      if (!gameRunning) {
        snake = [{x: 10, y: 10}];
        direction = {x: 1, y: 0};
        nextDirection = {x: 1, y: 0};
        score = 0;
        scoreDisplay.textContent = score;
        gameRunning = true;
        gamePaused = false;
        gameOverModal.classList.remove('show');
        pauseBtn.textContent = 'Pause';
        startBtn.textContent = 'Reset';
        spawnFood();
        draw();
        gameLoopId = setInterval(gameLoop, 100);
      }
    }

    function endGame() {
      gameRunning = false;
      clearInterval(gameLoopId);

      if (score > highScore) {
        highScore = score;
        highScoreDisplay.textContent = highScore;
        localStorage.setItem('snakeHighScore', highScore);
      }

      document.getElementById('finalScore').textContent = `Score: ${score}`;
      gameOverModal.classList.add('show');
      startBtn.textContent = 'Start Game';
    }

    function togglePause() {
      if (gameRunning) {
        gamePaused = !gamePaused;
        pauseBtn.textContent = gamePaused ? 'Resume' : 'Pause';
      }
    }

    function handleKeyPress(e) {
      if (!gameRunning) return;

      const key = e.key.toLowerCase();
      const arrowMap = {
        'arrowup': {x: 0, y: -1},
        'arrowdown': {x: 0, y: 1},
        'arrowleft': {x: -1, y: 0},
        'arrowright': {x: 1, y: 0},
        'w': {x: 0, y: -1},
        's': {x: 0, y: 1},
        'a': {x: -1, y: 0},
        'd': {x: 1, y: 0}
      };

      if (key in arrowMap) {
        e.preventDefault();
        const newDir = arrowMap[key];
        // Prevent reversing into itself
        if (!(newDir.x === -direction.x && newDir.y === -direction.y)) {
          nextDirection = newDir;
        }
      }

      if (key === ' ') {
        e.preventDefault();
        togglePause();
      }
    }

    startBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    document.addEventListener('keydown', handleKeyPress);

    draw();
  </script>
</body>
</html>
